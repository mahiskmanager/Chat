<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inside — Crear Cuenta</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
<div class="auth-bg">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
</div>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand-auth">
      <div class="brand-logo">IN</div>
      <h1>Únete a Inside</h1>
      <p>Crea tu cuenta en segundos</p>
    </div>
    <div class="alert hidden" id="alertBox"></div>
    <form id="registerForm" autocomplete="off">
      <div class="field">
        <label>Nombre de usuario</label>
        <input type="text" id="displayName" placeholder="Tu nombre visible" required maxlength="20">
      </div>
      <div class="field">
        <label>Correo electrónico</label>
        <input type="email" id="email" placeholder="tucorreo@ejemplo.com" required>
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input type="password" id="password" placeholder="Mínimo 6 caracteres" required minlength="6">
      </div>
      <button type="submit" class="btn-primary" id="registerBtn">
        <span class="btn-text">Crear cuenta</span><span class="spinner hidden"></span>
      </button>
    </form>
    <p class="auth-foot">¿Ya tienes cuenta? <a href="index.html">Iniciar sesión</a></p>
  </div>
  <p class="app-ver">Inside v2.0 · Firebase Realtime</p>
</div>
<script type="module" src="js/auth.js"></script>
</body>
</html>
